<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Break Identifier — Technical Architecture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.454.0/dist/umd/lucide-react.min.js"></script>
  <style>
    body { margin: 0; }
    .mono { font-family: 'Courier New','Courier',monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scroll-bg,#f1f5f9); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb,#cbd5e1); border-radius: 3px; }
    .tab-btn { transition: all 0.15s ease; }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-1px); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .animate-in { animation: fadeIn 0.3s ease forwards; }

    /* ── Light ── */
    .theme-light { --bg:#f8fafc; --card:#fff; --border:#e5e7eb; --text:#1f2937; --dim:#6b7280; --muted:#9ca3af; }
    .theme-light { --yellow:#f59e0b; --red:#f43f5e; --blue:#6366f1; --purple:#8b5cf6; --green:#10b981; --pink:#ec4899; }
    .theme-light { --ydim:#fffbeb; --rdim:#fff1f2; --bdim:#eef2ff; --pdim:#f5f3ff; --gdim:#ecfdf5; --pkdim:#fdf2f8; }
    .theme-light { --scroll-bg:#f1f5f9; --scroll-thumb:#cbd5e1; --font-body:'Inter',system-ui,sans-serif; }

    /* ── Gruvbox ── */
    .theme-gruvbox { --bg:#282828; --card:#3c3836; --border:#504945; --text:#ebdbb2; --dim:#a89984; --muted:#928374; }
    .theme-gruvbox { --yellow:#fabd2f; --red:#fb4934; --blue:#83a598; --purple:#d3869b; --green:#b8bb26; --pink:#d79921; }
    .theme-gruvbox { --ydim:#504945; --rdim:#504945; --bdim:#504945; --pdim:#504945; --gdim:#504945; --pkdim:#504945; }
    .theme-gruvbox { --scroll-bg:#504945; --scroll-thumb:#665c54; --font-body:'Inter',system-ui,sans-serif; }

    /* ── High-Contrast ── */
    .theme-highcontrast { --bg:#000; --card:#0a0a0a; --border:#1a1a1a; --text:#fff; --dim:#888; --muted:#555; }
    .theme-highcontrast { --yellow:#FFE600; --red:#FF3333; --blue:#3399FF; --purple:#AA66FF; --green:#00FF66; --pink:#FF66B2; }
    .theme-highcontrast { --ydim:#332600; --rdim:#330000; --bdim:#001a33; --pdim:#1a0033; --gdim:#003311; --pkdim:#330022; }
    .theme-highcontrast { --scroll-bg:#111; --scroll-thumb:#333; --font-body:'Courier New','Courier',monospace; }
    .theme-highcontrast .card-hover:hover { transform:none; outline:1px solid rgba(255,255,255,0.2); }

    body { font-family: var(--font-body); background: var(--bg); color: var(--text); margin:0; }
  </style>
</head>
<body class="theme-highcontrast">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, createElement: h } = React;
    const {
      Cpu, Layers, Terminal, FileSpreadsheet, Scissors, Eye,
      Search, ArrowRight, ArrowDown, CheckCircle, FolderOpen,
      Cog, GitMerge, Clock, Tv, Database, Filter, Play,
      Sliders, Shield, Settings, Workflow, FileOutput, Sun, Moon, Monitor
    } = LucideReact;

    const THEMES = ['light','gruvbox','highcontrast'];
    const THEME_LABELS = { light:'Light', gruvbox:'Gruvbox', highcontrast:'High-Contrast' };
    const THEME_ICONS  = { light:Sun, gruvbox:Moon, highcontrast:Monitor };

    function useTheme() {
      const [t, setT] = useState('highcontrast');
      useEffect(() => {
        THEMES.forEach(tt => document.body.classList.remove(`theme-${tt}`));
        document.body.classList.add(`theme-${t}`);
      }, [t]);
      return { t, setT };
    }

    const s = (n) => `var(--${n})`;

    const TABS = [
      { id:'overview',  label:'Pipeline',        icon:Layers },
      { id:'metadata',  label:'Stage 1: Metadata',  icon:FileSpreadsheet },
      { id:'clip',      label:'Stage 2: Clip Extr.', icon:Scissors },
      { id:'detect',    label:'Stage 3: AI Detect', icon:Eye },
      { id:'refine',    label:'Stage 4: Refinement', icon:Search },
      { id:'extract',   label:'Stage 5: Ad Clips',  icon:FileOutput },
      { id:'automation',label:'Automation',        icon:FolderOpen },
    ];

    function SectionHeader({ icon:Icon, title, color }) {
      return h('div', { className:'flex items-center gap-2 mb-3 pb-2', style:{borderBottom:`1px solid ${color||s('border')}`} },
        h(Icon, { className:'w-4 h-4', style:{color:color||s('dim')} }),
        h('h3', { className:'font-bold text-sm', style:{color:color||s('dim')} }, title)
      );
    }

    function PipelineNode({ label, sublabel, color, icon:Icon, border }) {
      return h('div', { className:'rounded-lg p-2 text-center min-w-max', style:{ background:color||s('card'), border:border||'none' } },
        Icon && h(Icon, { className:'w-3.5 h-3.5 mx-auto mb-0.5', style:{color:'#ccc'} }),
        h('p', { className:'text-xs font-bold', style:{color:'#ccc'} }, label),
        sublabel && h('p', { className:'text-xs opacity-70 leading-tight', style:{color:s('dim')} }, sublabel)
      );
    }

    function PipeArrow({ label }) {
      return h('div', { className:'flex flex-col items-center justify-center px-0.5 shrink-0' },
        h(ArrowRight, { className:'w-3.5 h-3.5', style:{color:s('muted')} }),
        label && h('span', { className:'text-xs', style:{color:s('muted')} }, label)
      );
    }

    function DownArrow({ label }) {
      return h('div', { className:'flex flex-col items-center py-1' },
        h(ArrowDown, { className:'w-4 h-4', style:{color:s('muted')} }),
        label && h('span', { className:'text-xs', style:{color:s('muted')} }, label)
      );
    }

    function ParamRow({ name, value, note }) {
      return h('div', { className:'flex items-baseline gap-2 py-1.5', style:{borderBottom:'1px solid '+s('border')} },
        h('code', { className:'mono text-xs px-1.5 py-0.5 rounded shrink-0', style:{background:s('card'), color:s('dim')} }, name),
        h('span', { className:'text-xs font-semibold', style:{color:s('text')} }, value),
        note && h('span', { className:'text-xs ml-auto', style:{color:s('muted')} }, note)
      );
    }

    function CodeBlock({ children, language }) {
      return h('pre', { className:'rounded-lg p-3 overflow-x-auto', style:{
        background:s('bg'), border:'1px solid '+s('border'),
        color: language==='json' ? s('dim') : s('green'),
        fontSize:'0.75rem'
      } }, children);
    }

    function Tag({ children, color }) {
      const map = { new:s('green'), update:s('yellow'), stable:s('dim') };
      const dim = { new:s('gdim'), update:s('ydim'), stable:s('border') };
      const c = map[color]||map.new;
      const d = dim[color]||dim.new;
      return h('span', { className:'text-xs font-bold px-1.5 py-0.5 rounded', style:{background:d, color:c, border:`1px solid ${c}`} }, children);
    }

    function App() {
      const { t, setT } = useTheme();
      const [activeTab, setActiveTab] = useState('overview');

      const renderTab = (tabId) => {
        const ani = { className: 'animate-in' };

        switch(tabId) {

          /* ══════════════ OVERVIEW ══════════════ */
          case 'overview': return h('div', { key:'overview', ...ani },
            h('div', { className:'rounded-2xl p-5 mb-4', style:{background:s('card'), border:`1px solid ${s('border')}`} },
              h(SectionHeader, { icon:Layers, title:'End-to-End Pipeline', color:s('blue') }),
              h('p', { className:'text-xs mb-4', style:{color:s('dim')} },
                'Five discrete stages, each with its own CLI command. Stages produce artifacts consumed by the next. ',
                h(Tag, { color:'new' }, 'NEW'), ' Stages 4 and 5 added since initial release.'
              ),

              /* 5-Stage Pipeline Flow */
              h('div', { className:'space-y-2' },
                /* Stage 1 */
                h('div', { className:'rounded-xl p-3 card-hover', style:{background:s('card'), border:`1px solid ${s('yellow')}`} },
                  h('div', { className:'flex items-center gap-2 mb-2' },
                    h('span', { className:'text-xs font-bold px-2 py-0.5 rounded', style:{background:s('yellow'), color:s('bg')} }, '1'),
                    h('p', { className:'text-xs font-bold', style:{color:s('yellow')} }, 'Metadata Extraction'),
                    h('code', { className:'mono text-xs ml-auto', style:{color:s('yellow')} }, 'advert-identifier-metadata-extract')
                  ),
                  h('div', { className:'flex items-center gap-1 overflow-x-auto text-xs' },
                    h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'Video filename'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'CSV lookup'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'Filter & group'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded font-bold', style:{background:s('ydim'), color:s('yellow'), border:`1px solid ${s('yellow')}`} }, '_metadata.json'),
                    h('span', { className:'px-1 text-xs', style:{color:s('muted')} }, '+'),
                    h('span', { className:'px-2 py-1 rounded font-bold', style:{background:s('bdim'), color:s('blue'), border:`1px solid ${s('blue')}`} }, '_pipeline_state.json')
                  )
                ),
                h(DownArrow, { label:'JSON metadata + state file' }),

                /* Stage 2 */
                h('div', { className:'rounded-xl p-3 card-hover', style:{background:s('card'), border:`1px solid ${s('red')}`} },
                  h('div', { className:'flex items-center gap-2 mb-2' },
                    h('span', { className:'text-xs font-bold px-2 py-0.5 rounded', style:{background:s('red'), color:s('bg')} }, '2'),
                    h('p', { className:'text-xs font-bold', style:{color:s('red')} }, 'Clip Extraction'),
                    h('code', { className:'mono text-xs ml-auto', style:{color:s('red')} }, 'advert-identifier-clip')
                  ),
                  h('div', { className:'flex items-center gap-1 overflow-x-auto text-xs' },
                    h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, '_metadata.json'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'FFmpeg seek'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, '-60s / +360s window'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded font-bold', style:{background:s('rdim'), color:s('red'), border:`1px solid ${s('red')}`} }, '_CLIP.mp4 per break')
                  )
                ),
                h(DownArrow, { label:'video clips' }),

                /* Stage 3 */
                h('div', { className:'rounded-xl p-3 card-hover', style:{background:s('card'), border:`1px solid ${s('purple')}`} },
                  h('div', { className:'flex items-center gap-2 mb-2' },
                    h('span', { className:'text-xs font-bold px-2 py-0.5 rounded', style:{background:s('purple'), color:s('bg')} }, '3'),
                    h('p', { className:'text-xs font-bold', style:{color:s('purple')} }, 'AI Identification', h('span', { className:'ml-1.5 font-normal', style:{color:s('muted')} }, '(1 FPS)')),
                    h('code', { className:'mono text-xs ml-auto', style:{color:s('purple')} }, 'advert-identifier')
                  ),
                  h('div', { className:'flex items-center gap-1 overflow-x-auto text-xs' },
                    h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'Clip + metadata'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'VLM analysis'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'Ensemble (5\u00d7) + vote'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded font-bold', style:{background:s('pdim'), color:s('purple'), border:`1px solid ${s('purple')}`} }, '_CLIP.xml + state update')
                  )
                ),
                h(DownArrow, { label:'XML results + coarse_1fps state' }),

                /* Stage 4 */
                h('div', { className:'rounded-xl p-3 card-hover', style:{background:s('card'), border:`1px solid ${s('green')}`, outline:`1px solid ${s('green')}44`} },
                  h('div', { className:'flex items-center gap-2 mb-2' },
                    h('span', { className:'text-xs font-bold px-2 py-0.5 rounded', style:{background:s('green'), color:s('bg')} }, '4'),
                    h('p', { className:'text-xs font-bold', style:{color:s('green')} }, 'Frame Refinement', h('span', { className:'ml-1.5 font-normal', style:{color:s('muted')} }, '(25 FPS)')),
                    h(Tag, { color:'new' }, 'NEW'),
                    h('code', { className:'mono text-xs ml-auto', style:{color:s('green')} }, 'advert-identifier-refine')
                  ),
                  h('div', { className:'flex items-center gap-1 overflow-x-auto text-xs' },
                    h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'XML + clip URL'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, '3s clip @ 25 FPS'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'Ensemble (3\u00d7) + MAD filter'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded font-bold', style:{background:s('gdim'), color:s('green'), border:`1px solid ${s('green')}`} }, '_refined.xml + state update')
                  )
                ),
                h(DownArrow, { label:'Refined XML + adjusted_start_broadcast' }),

                /* Stage 5 */
                h('div', { className:'rounded-xl p-3 card-hover', style:{background:s('card'), border:`1px solid ${s('pink')}`, outline:`1px solid ${s('pink')}44`} },
                  h('div', { className:'flex items-center gap-2 mb-2' },
                    h('span', { className:'text-xs font-bold px-2 py-0.5 rounded', style:{background:s('pink'), color:s('bg')} }, '5'),
                    h('p', { className:'text-xs font-bold', style:{color:s('pink')} }, 'Advert Clip Extraction'),
                    h(Tag, { color:'new' }, 'NEW'),
                    h('code', { className:'mono text-xs ml-auto', style:{color:s('pink')} }, 'advert-identifier-single-advert-clip')
                  ),
                  h('div', { className:'flex items-center gap-1 overflow-x-auto text-xs' },
                    h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'Refined XML'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'State file seek offset'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, 'FFmpeg lossless cut'),
                    h(PipeArrow), h('span', { className:'px-2 py-1 rounded font-bold', style:{background:s('pkdim'), color:s('pink'), border:`1px solid ${s('pink')}`} }, 'Individual .mp4 per advert')
                  )
                )
              ),

              /* File naming */
              h('div', { className:'mt-4 rounded-xl p-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                h('p', { className:'text-xs font-bold mb-2', style:{color:s('dim')} }, 'File Naming Convention'),
                h('div', { className:'space-y-1 mono text-xs' },
                  h('div', { className:'flex items-baseline gap-2' }, h('span', { style:{color:s('muted')} }, 'Video:'), h('span', { style:{color:s('blue')} }, 'YYYY-MM-DD_CHANNEL_HH:MM:SS.mp4')),
                  h('div', { className:'flex items-baseline gap-2' }, h('span', { style:{color:s('muted')} }, 'CSV:'),   h('span', { style:{color:s('yellow')} }, 'YYYY-MM-DD_BFIExport.csv')),
                  h('div', { className:'flex items-baseline gap-2' }, h('span', { style:{color:s('muted')} }, 'State:'),  h('span', { style:{color:s('blue')} }, '{video}_pipeline_state.json')),
                  h('div', { className:'flex items-baseline gap-2' }, h('span', { style:{color:s('muted')} }, 'Clip:'),   h('span', { style:{color:s('red')} }, '{video}_{index}of{total}_CLIP.mp4')),
                  h('div', { className:'flex items-baseline gap-2' }, h('span', { style:{color:s('muted')} }, 'Advert:'),  h('span', { style:{color:s('green')} }, '{unique_id}_{category}_{brand}.mp4'))
                )
              )
            ),

            /* CLI commands */
            h('div', { className:'rounded-2xl p-5', style:{background:s('card'), border:`1px solid ${s('border')}`} },
              h(SectionHeader, { icon:Terminal, title:'CLI Commands', color:s('muted') }),
              h('div', { className:'space-y-2' },
                h(CommandCard, { name:'advert-identifier', desc:'Core 1 FPS detection with ensemble voting', args:['--mode timecode|frame','--ad-break-index N','--no-ensemble','--no-thinking','--verbose','--debug','--model NAME'], color:s('purple') }),
                h(CommandCard, { name:'advert-identifier-refine', desc:'25 FPS frame-accurate boundary refinement', args:['--xml-file','--video-url','--json-file','--refine-fps 25','--ensemble-filter mad','--no-thinking'], color:s('green'), tag:'NEW' }),
                h(CommandCard, { name:'advert-identifier-pipeline', desc:'Full automation: processes entire folders end-to-end', args:['--input-folder','--csv-folder','--video-server-url','--dry-run','--log-level'], color:s('blue') }),
                h(CommandCard, { name:'advert-identifier-metadata-extract', desc:'Parses video filenames \u2192 matches CSV \u2192 produces metadata + state JSON', args:['--video','--csv-folder','--output-dir','--before-secs'], color:s('yellow') }),
                h(CommandCard, { name:'advert-identifier-clip', desc:'FFmpeg clip extraction centered on ad break timestamps', args:['--json-file','--before-secs 60','--after-secs 360','--overlay-type'], color:s('red') }),
                h(CommandCard, { name:'advert-identifier-single-advert-clip', desc:'Lossless individual advert clip extraction', args:['--xml-file','--video-url','--state-file','--output-dir','--trim','--pad'], color:s('pink'), tag:'NEW' }),
                h(CommandCard, { name:'advert-identifier-benchmark', desc:'Accuracy testing against ground truth', args:['--ground-truth-first','-n 10'], color:s('muted') }),
              )
            )
          );

          /* ══════════════ METADATA ══════════════ */
          case 'metadata': return h('div', { key:'metadata', ...ani },
            h('div', { className:'rounded-2xl p-5', style:{background:s('card'), border:`1px solid ${s('border')}`} },
              h(SectionHeader, { icon:FileSpreadsheet, title:'Stage 1 \u2014 Metadata Extraction', color:s('yellow') }),
              h('p', { className:'text-xs mb-4', style:{color:s('dim')} },
                'Parses the video filename to extract date and channel, locates the corresponding CSV scheduling file, and filters it to the relevant broadcast window. Outputs structured JSON with ad break timestamps plus a ',
                h('code', { className:'mono px-1 rounded text-xs', style:{background:s('card'), color:s('dim')} }, '_pipeline_state.json'),
                ' for advert tracking across all stages.'
              ),
              h('div', { className:'rounded-xl p-4 mb-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                h('p', { className:'text-xs font-bold mb-2', style:{color:s('yellow')} }, 'Processing Flow'),
                h('div', { className:'flex items-center gap-1 overflow-x-auto pb-1' },
                  h(PipelineNode, { label:'Video filename', sublabel:'date + channel + time', color:s('card'), icon:Tv }),
                  h(PipeArrow), h(PipelineNode, { label:'Locate CSV', sublabel:'YYYY-MM-DD_BFIExport.csv', color:s('card'), icon:Search }),
                  h(PipeArrow), h(PipelineNode, { label:'Filter by channel', sublabel:'+ time window', color:s('ydim'), border:`1px solid ${s('yellow')}`, icon:Filter }),
                  h(PipeArrow), h(PipelineNode, { label:'Group ad breaks', sublabel:'consecutive ads', color:s('ydim'), icon:Database }),
                  h(PipeArrow), h(PipelineNode, { label:'_metadata.json', color:s('ydim'), icon:CheckCircle }),
                  h('span', { className:'px-1 text-xs', style:{color:s('muted')} }, '+'),
                  h(PipelineNode, { label:'_pipeline_state.json', sublabel:'per-advert tracking', color:s('bdim'), icon:GitMerge })
                )
              ),
              h('div', { className:'rounded-xl p-3 mb-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                h('p', { className:'text-xs font-bold mb-2', style:{color:s('dim')} }, 'Pipeline State File ', h(Tag, { color:'update' }, 'UPDATED')),
                h('p', { className:'text-xs mb-2', style:{color:s('dim')} },
                  'The state file is ', h('strong', { style:{color:s('text')} }, 'the system of record'), ' for advert progression. Created here, updated by each subsequent stage.'
                ),
                h('div', { className:'flex items-center gap-2 text-xs mb-2', style:{color:s('dim')} },
                  h(ArrowRight, { className:'w-3 h-3' }), h('span', null, 'State machine: '),
                  ['Extracted','Clipped','Identified','Refined','Clipped'].map((st,i,a) =>
                    h('span', { key:st, className:'flex items-center gap-1' },
                      h('span', { style:{color:s('muted')} }, st),
                      i<a.length-1 && h('span', { style:{color:s('muted')} }, '\u2192'))
                  )
                )
              ),
              h('div', { className:'rounded-xl p-3 mb-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                h('p', { className:'text-xs font-bold mb-2', style:{color:s('dim')} }, 'Output Structure (per ad break)'),
                h(CodeBlock, { language:'json' },
`{
  "ad_breaks": [{
    "index": 0,
    "programme_before": {"title": "ITV LUNCHTIME NEWS"},
    "programme_after": {"title": "ITV LUNCHTIME NEWS"},
    "start_time": "13:52:05",
    "end_time": "13:55:35",
    "adverts": [{
      "unique_id": "BBHTCPT536010",
      "advertiser": "Tesco stores",
      "brand": "Tesco easter",
      "category": "Food & drink",
      "duration_seconds": 10,
      "start_time": "13:52:05",
      "position_in_break": "First"
    }]
  }],
  "summary": { "total_ad_breaks": 1, "total_adverts": 7 }
}`
                )
              ),
              h('div', { className:'rounded-xl p-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                h('p', { className:'text-xs font-bold mb-2', style:{color:s('dim')} }, 'Key Parameters'),
                h(ParamRow, { name:'--video', value:'path/to/video.mp4', note:'filename parsed for date/channel' }),
                h(ParamRow, { name:'--csv-folder', value:'path/to/csv/', note:'defaults to video directory' }),

                   {step:'3',text:'Extract clips with FFmpeg',color:s('red')},
                   {step:'4',text:'Run 1 FPS AI identification with ensemble',color:s('purple')},
                   {step:'5',text:'Run 25 FPS frame refinement',color:s('green')},
                   {step:'6',text:'Extract individual advert clips',color:s('pink')},
                   {step:'7',text:'Generate summary report',color:s('dim')},
                  ].map((item,i) => h('div', { key:i, className:'flex items-start gap-2 py-1.5', style:{borderBottom:`1px solid ${s('border')}`} },
                    h('span', { className:'text-xs font-bold px-1.5 py-0.5 rounded shrink-0', style:{background:s('card'), color:s('dim'), border:'1px solid '+s('border')} }, item.step),
                    h('p', { className:'text-xs', style:{color:item.color} }, item.text)))
                )
              ),
              h('div', { className:'rounded-xl p-3 mb-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                h('p', { className:'text-xs font-bold mb-2', style:{color:s('dim')} }, 'Pipeline State File (System of Record)'),
                h(CodeBlock, { language:'json' },
`{
  "pipeline_version": 1,
  "video_info": {"filepath": "2024-03-26_ITV1HD_13:30:00.mp4"},
  "ad_breaks": [{
    "index": 1,
    "start_time": "13:52:05",
    "clip_offset": 1295.0,
    "adverts": [{
      "unique_id": "BBHTCPT536010",
      "brand": "Tesco",
      "status": "refined",
      "coarse_1fps": {"last_timecode": "22:05"},
      "refined_25fps": {"last_timecode": "00:22:05.080", "adjusted_start_broadcast": 2610.08}
    }]
  }]
}`
                )
              )
            ),
            h('div', { className:'rounded-2xl p-5 mt-4', style:{background:s('card'), border:`1px solid ${s('border')}`} },
              h(SectionHeader, { icon:Settings, title:'Requirements', color:s('muted') }),
              h('div', { className:'grid grid-cols-1 md:grid-cols-2 gap-3' },
                h('div', { className:'rounded-xl p-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                  h('p', { className:'text-xs font-bold mb-2', style:{color:s('dim')} }, 'Runtime'),
                  h(ParamRow, { name:'Python', value:'3.10+' }), h(ParamRow, { name:'FFmpeg', value:'in PATH' }),
                  h(ParamRow, { name:'vLLM', value:'server with VLM loaded' }), h(ParamRow, { name:'Model', value:'Qwen3.5-4B' })),
                h('div', { className:'rounded-xl p-3', style:{background:s('bg'), border:`1px solid ${s('border')}`} },
                  h('p', { className:'text-xs font-bold mb-2', style:{color:s('dim')} }, 'Model Options'),
                  h('div', { className:'space-y-1.5' },
                    h('div', { className:'flex items-center gap-2' }, h('span', { className:'text-xs font-bold', style:{color:s('blue')} }, 'Qwen3.5-4B'), h('span', { className:'text-xs', style:{color:s('muted')} }, '\u2014 60s video, fast')),
                    h('div', { className:'flex items-center gap-2' }, h('span', { className:'text-xs font-bold', style:{color:s('purple')} }, 'Qwen3.5-9B'), h('span', { className:'text-xs', style:{color:s('muted')} }, '\u2014 medium video')),
                    h('div', { className:'flex items-center gap-2' }, h('span', { className:'text-xs font-bold', style:{color:s('yellow')} }, 'Qwen3.5-27B-FP8'), h('span', { className:'text-xs', style:{color:s('muted')} }, '\u2014 text-only, fast')))
                )
              )
            ),
            h('p', { className:'text-center text-xs mt-6 mb-4', style:{color:s('muted')} },
              'Qwen3.5 \u00b7 FFmpeg \u00b7 vLLM \u00b7 BFI National Archive')
          );
        }
      };

      return h('div', { className:'min-h-screen p-4 md:p-8', style:{background:'var(--bg)'} },
        h('div', { className:'max-w-4xl mx-auto' },
          /* Header */
          h('div', { className:'text-center mb-6' },
            h('div', { className:'inline-flex items-center gap-2 px-4 py-2 rounded text-xs font-bold mb-3 tracking-wide',
                       style:{background:s('gdim'), color:s('green'), border:`1px solid ${s('green')}`} },
              h(Cpu, { className:'w-3.5 h-3.5' }), 'AD BREAK IDENTIFIER \u2014 TECHNICAL ARCHITECTURE v2'
            ),
            h('h1', { className:'text-2xl md:text-3xl font-bold mb-2' }, 'Detection Pipeline Architecture'),
            h('p', { className:'text-sm max-w-2xl mx-auto', style:{color:s('dim')} },
              'Five-stage pipeline: CSV metadata extraction \u2192 FFmpeg clip extraction \u2192 1 FPS VLM detection \u2192 25 FPS frame refinement \u2192 lossless advert clip extraction.'
            )
          ),

          /* Theme toggle */
          h('div', { className:'flex items-center justify-center gap-1 rounded-xl p-1 mb-4', style:{background:s('card'), border:`1px solid ${s('border')}`, maxWidth:'360px', margin:'0 auto 1rem'} },
            THEMES.map(tt => {
              const Icon = THEME_ICONS[tt];
              const active = t === tt;
              return h('button', {
                key: tt, onClick: () => setT(tt),
                className: 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all',
                style: active ? { background:s('blue'), color:'#fff' } : { color:s('dim') }
              }, h(Icon, { className:'w-3.5 h-3.5' }), THEME_LABELS[tt]);
            })
          ),

          /* Tabs */
          h('div', { className:'flex gap-1 mb-4 rounded-xl p-1 overflow-x-auto', style:{background:s('card'), border:`1px solid ${s('border')}`} },
            TABS.map(tab =>
              h('button', {
                key:tab.id, onClick:()=>setActiveTab(tab.id),
                className:'tab-btn flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all',
                style: activeTab===tab.id ? { background:s('blue'), color:'#000' } : { color:s('muted') }
              }, h(tab.icon, { className:'w-3.5 h-3.5' }), tab.label)
            )
          ),

          /* Tab Content */
          renderTab(activeTab)
        )
      );
    }

    function CommandCard({ name, desc, args, color, tag }) {
      return h('div', { className:'rounded-xl p-3 card-hover', style:{background:s('card'), borderLeft:`3px solid ${color||s('blue')}`, borderTop:'1px solid '+s('border'), borderRight:'1px solid '+s('border'), borderBottom:'1px solid '+s('border')} },
        h('div', { className:'flex items-center gap-2 mb-1' },
          h('code', { className:'mono text-xs font-bold', style:{color:s('text')} }, name),
          tag && h(Tag, { color:'new' }, tag)
        ),
        h('p', { className:'text-xs mb-2', style:{color:s('dim')} }, desc),
        h('div', { className:'flex flex-wrap gap-1' },
          args.map((a,i) => h('span', { key:i, className:'mono text-xs px-1.5 py-0.5 rounded', style:{background:s('bg'), color:s('dim'), border:'1px solid '+s('border')} }, a))
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
