<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Break Identifier — How It Works</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.454.0/dist/umd/lucide-react.min.js"></script>
  <style>
    body { margin: 0; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scroll-bg, #f1f5f9); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb, #cbd5e1); border-radius: 4px; }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); }
    @keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,0.4)} 50%{box-shadow:0 0 0 8px rgba(59,130,246,0)} }
    .pulse { animation: pulse-dot 2s infinite; }

    /* ── Theme: Light ── */
    .theme-light { --font-body: 'Inter', system-ui, sans-serif; }
    .theme-light { --bg: #f8fafc; --card: #fff; --border: #e5e7eb; --text: #1f2937; --dim: #6b7280; --muted: #9ca3af; }
    .theme-light { --yellow: #f59e0b; --red: #f43f5e; --blue: #6366f1; --purple: #8b5cf6; --green: #10b981; --pink: #ec4899; }
    .theme-light { --ydim: #fffbeb; --rdim: #fff1f2; --bdim: #eef2ff; --pdim: #f5f3ff; --gdim: #ecfdf5; --pkdim: #fdf2f8; }
    .theme-light { --scroll-bg: #f1f5f9; --scroll-thumb: #cbd5e1; }

    /* ── Theme: Gruvbox ── */
    .theme-gruvbox { --font-body: 'Inter', system-ui, sans-serif; }
    .theme-gruvbox { --bg: #282828; --card: #3c3836; --border: #504945; --text: #ebdbb2; --dim: #a89984; --muted: #928374; }
    .theme-gruvbox { --yellow: #fabd2f; --red: #fb4934; --blue: #83a598; --purple: #d3869b; --green: #b8bb26; --pink: #d79921; }
    .theme-gruvbox { --ydim: #504945; --rdim: #504945; --bdim: #504945; --pdim: #504945; --gdim: #504945; --pkdim: #504945; }
    .theme-gruvbox { --scroll-bg: #504945; --scroll-thumb: #665c54; }

    /* ── Theme: High-Contrast ── */
    .theme-highcontrast { --font-body: 'Courier New', 'Courier', monospace; }
    .theme-highcontrast { --bg: #000; --card: #0a0a0a; --border: #1a1a1a; --text: #fff; --dim: #888; --muted: #555; }
    .theme-highcontrast { --yellow: #FFE600; --red: #FF3333; --blue: #3399FF; --purple: #AA66FF; --green: #00FF66; --pink: #FF66B2; }
    .theme-highcontrast { --ydim: #332600; --rdim: #330000; --bdim: #001a33; --pdim: #1a0033; --gdim: #003311; --pkdim: #330022; }
    .theme-highcontrast { --scroll-bg: #111; --scroll-thumb: #333; }
    .theme-highcontrast .step-card { border: 1px solid #1a1a1a; }
    .theme-highcontrast .card-hover:hover { transform: none; outline: 1px solid rgba(255,255,255,0.25); }

    body { font-family: var(--font-body); background: var(--bg); color: var(--text); margin: 0; }
  </style>
</head>
<body class="theme-highcontrast">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, createElement: h } = React;
    const { ArrowDown, Sparkles, FileSpreadsheet, Scissors, Eye, Users, Search, Zap, FolderOpen, Film, GitMerge, Sun, Moon, Monitor } = LucideReact;

    const THEMES = ['light','gruvbox','highcontrast'];
    const THEME_LABELS = { light:'Light', gruvbox:'Gruvbox', highcontrast:'High-Contrast' };
    const THEME_ICONS  = { light:Sun, gruvbox:Moon, highcontrast:Monitor };

    function useTheme() {
      const [t, setT] = useState('highcontrast');
      useEffect(() => {
        THEMES.forEach(tt => document.body.classList.remove(`theme-${tt}`));
        document.body.classList.add(`theme-${t}`);
      }, [t]);
      return { t, setT };
    }

    function useInView(ref) {
      const [v, s] = useState(false);
      useEffect(() => {
        if (!ref.current) return;
        const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { s(true); o.disconnect(); } }, { threshold: 0.15 });
        o.observe(ref.current);
        return () => o.disconnect();
      }, [ref]);
      return v;
    }

    function StepCard({ icon: Icon, title, children, i, tag, color }) {
      const ref = useRef(null);
      const iv = useInView(ref);
      return h('div', { ref, className: `transition-all duration-500 ease-out ${iv ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}` },
        h('div', {
          className: 'step-card rounded-xl p-6',
          style: { background: 'var(--card)', transitionDelay: `${i * 100}ms`, borderLeft: `3px solid ${color||'var(--blue)'}` }
        },
          h('div', { className: 'flex items-center gap-3 mb-4' },
            h('div', { className: 'w-10 h-10 rounded flex items-center justify-center shrink-0', style: { background: color||'var(--blue)' } },
              h(Icon, { className: 'w-5 h-5', style: { color: 'var(--bg)' } })
            ),
            h('div', { className: 'flex-1' },
              h('div', { className: 'flex items-center gap-2' },
                h('p', { className: 'text-xs font-bold', style: { color: 'var(--muted)', textTransform:'uppercase', letterSpacing:'0.05em' } }, `Step ${i+1}`),
                tag && h('span', { className: 'text-xs font-bold px-2 py-0.5 rounded',
                  style: { background: tag==='NEW'?'var(--gdim)':'var(--pkdim)', color: tag==='NEW'?'var(--green)':'var(--pink)', border:`1px solid ${tag==='NEW'?'var(--green)':'var(--pink)'}` }
                }, tag)
              ),
              h('h3', { className: 'text-lg font-bold mt-1', style: { color: 'var(--text)' } }, title)
            )
          ),
          children
        )
      );
    }

    function Arrow() {
      return h('div', { className: 'flex justify-center py-2' }, h(ArrowDown, { className: 'w-6 h-6', style: { color: 'var(--muted)' } }));
    }

    function ThemeToggle({ t, setT }) {
      return h('div', { className: 'flex items-center justify-center gap-1 rounded-xl p-1 mb-6', style:{background:'var(--card)', border:'1px solid var(--border)'} },
        THEMES.map(tt => {
          const Icon = THEME_ICONS[tt];
          const active = t === tt;
          return h('button', {
            key: tt, onClick: () => setT(tt),
            className: 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all',
            style: active ? { background: 'var(--blue)', color: '#fff' } : { color: 'var(--dim)' }
          }, h(Icon, { className: 'w-3.5 h-3.5' }), THEME_LABELS[tt]);
        })
      );
    }

    function App() {
      const { t, setT } = useTheme();
      const [mounted, setMounted] = useState(false);
      useEffect(() => { setMounted(true); }, []);

      return h('div', { className: 'min-h-screen p-4 md:p-8', style: { background: 'var(--bg)' } },
        h('div', { className: 'max-w-2xl mx-auto' },

          /* ── header ── */
          h('div', { className: `text-center mb-6 transition-all duration-700 ease-out ${mounted?'opacity-100 translate-y-0':'opacity-0 -translate-y-4'}` },
            h('div', { className: 'inline-flex items-center gap-2 px-4 py-2 rounded text-sm font-bold mb-4',
                       style: { background: 'var(--gdim)', color: 'var(--green)', border: '1px solid var(--green)' } },
              h(Sparkles, { className: 'w-4 h-4' }), 'Ad Break Identifier'
            ),
            h('h1', { className: 'text-2xl md:text-4xl font-bold mb-2', style: { color: 'var(--text)' } }, 'How It Works'),
            h('p', { className: 'text-sm max-w-lg mx-auto', style: { color: 'var(--dim)' } },
              'AI that watches TV recordings and identifies every individual advert within an ad break \u2014 from scheduling data to frame-accurate clip extraction.'
            )
          ),

          /* ── theme toggle ── */
          h(ThemeToggle, { t, setT }),

          /* ── big picture ── */
          h('div', { className: `rounded-xl p-5 mb-6 transition-all duration-700 delay-200 ease-out ${mounted?'opacity-100 translate-y-0':'opacity-0 translate-y-4'}`,
                      style: { background: 'var(--card)', border: '1px solid var(--border)', borderLeft: '3px solid var(--blue)' } },
            h('p', { className: 'text-sm font-bold mb-2', style: { color: 'var(--blue)' } }, '\u25b6 The Big Picture'),
            h('p', { className: 'text-sm', style: { color: 'var(--dim)' } },
              'TV recordings contain ad breaks with multiple adverts back-to-back. This tool already knows ',
              h('em', { style: { color: 'var(--green)' } }, 'what'), ' adverts should be in each break (from scheduling data), ',
              'uses AI to find ', h('em', { style: { color: 'var(--green)' } }, 'where'), ' each one ends in the video, ',
              'then refines those boundaries to ', h('strong', { style: { color: 'var(--red)' } }, 'millisecond precision'), ' ',
              'and extracts each advert as a separate video file.'
            )
          ),

          /* ── pipeline glance ── */
          h('div', { className: `rounded-xl p-5 mb-6 transition-all duration-700 delay-300 ease-out ${mounted?'opacity-100 translate-y-0':'opacity-0 translate-y-4'}`,
                      style: { background: 'var(--card)', border: '1px solid var(--border)' } },
            h('p', { className: 'text-xs font-bold mb-3', style: { color: 'var(--muted)', textTransform:'uppercase', letterSpacing:'0.05em' } }, 'The Pipeline at a Glance'),
            h('div', { className: 'flex flex-wrap items-center justify-center gap-1 md:gap-2' },
              ['CSV & Video', 'Clip', '1 FPS AI', '25 FPS Refine', 'Advert Clips'].map((l, i, a) =>
                h('div', { key: l, className: 'flex items-center gap-1 md:gap-2' },
                  h('div', { className: 'text-xs font-bold px-2.5 py-1.5 rounded whitespace-nowrap',
                    style: {
                      background: ['var(--ydim)','var(--rdim)','var(--pdim)','var(--bdim)','var(--gdim)'][i],
                      color: ['var(--yellow)','var(--red)','var(--purple)','var(--blue)','var(--green)'][i],
                      border: `1px solid ${['var(--yellow)','var(--red)','var(--purple)','var(--blue)','var(--green)'][i]}`
                    }
                  }, l),
                  i < a.length-1 && h('span', { className: 'text-xs', style: { color: 'var(--muted)' } }, '\u2192')
                )
              )
            )
          ),

          /* ── STEP 1 ── */
          Arrow(),
          h(StepCard, { icon: FileSpreadsheet, title: 'Read the Schedule', i:0, color: 'var(--yellow)' },
            h('p', { className: 'text-sm mb-4', style: { color: 'var(--dim)' } },
              'The BFI National Archive obtains scheduling data as CSV files. These contain what was broadcast and approximately when \u2014 including every advert, its brand, duration, and timecode. The tool reads these files and matches them to the video recording.'
            ),
            h('div', { className: 'rounded-xl p-4', style: { background: 'var(--ydim)', border: '1px solid var(--yellow)' } },
              h('div', { className: 'flex items-center gap-3 mb-3' },
                h('span', { className: 'text-2xl' }, '\ud83d\udccb'),
                h('div', null,
                  h('p', { className: 'text-sm font-bold', style: { color: 'var(--yellow)' } }, 'CSV Scheduling Data'),
                  h('p', { className: 'text-xs', style: { color: 'var(--yellow)', opacity: 0.7 } }, 'e.g. 2024-03-26_BFIExport.csv')
                )
              ),
              h('div', { className: 'rounded-lg p-3 space-y-1', style: { background: 'var(--bg)', border: '1px solid var(--border)' } },
                h('p', { style: { color: 'var(--dim)' } }, '13:52:05 \u2014 ', h('span', { style: { color: 'var(--green)' } }, 'Tesco'), ' (10s)'),
                h('p', { style: { color: 'var(--dim)' } }, '13:52:15 \u2014 ', h('span', { style: { color: 'var(--blue)' } }, 'Sky Mobile'), ' (30s)'),
                h('p', { style: { color: 'var(--dim)' } }, '13:52:45 \u2014 ', h('span', { style: { color: 'var(--yellow)' } }, 'Cadbury'), ' (20s)'),
                h('p', { style: { color: 'var(--muted)' } }, '...and so on')
              ),
              h('p', { className: 'text-xs mt-2', style: { color: 'var(--yellow)', opacity: 0.7 } },
                'The tool also creates a pipeline state file that tracks every advert through all subsequent stages.'
              )
            )
          ),

          /* ── STEP 2 ── */
          Arrow(),
          h(StepCard, { icon: Scissors, title: 'Cut Out the Ad Breaks', i:1, color: 'var(--red)' },
            h('p', { className: 'text-sm mb-4', style: { color: 'var(--dim)' } },
              'Rather than processing an entire hours-long recording, the tool cuts out just the ad break sections using FFmpeg. It knows from the schedule roughly when each ad break starts, so it extracts a short clip with configurable buffer \u2014 typically 60 seconds before and 360 seconds after.'
            ),
            h('div', { className: 'rounded-xl p-4', style: { background: 'var(--rdim)', border: '1px solid var(--red)' } },
              h('div', { className: 'flex items-end gap-0.5 mb-3' },
                [...Array(20)].map((_, i) => {
                  const is = i >= 6 && i <= 13;
                  return h('div', { key:i, className:'flex-1 flex flex-col items-center gap-0.5' },
                    h('div', { className: 'w-full rounded-sm', style: { height: is?32:20, background: is?'var(--red)':'var(--muted)' } })
                  );
                })
              ),
              h('div', { className: 'flex items-center gap-2 text-xs' },
                h('div', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 rounded-sm', style: { background: 'var(--muted)' } }), h('span', { style: { color: 'var(--dim)' } }, 'Programme')),
                h('div', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 rounded-sm', style: { background: 'var(--red)' } }), h('span', { style: { color: 'var(--red)' } }, 'Ad break'))
              )
            )
          ),

          /* ── STEP 3 ── */
          Arrow(),
          h(StepCard, { icon: Eye, title: 'AI "Watches" at 1 FPS', i:2, color: 'var(--purple)' },
            h('p', { className: 'text-sm mb-4', style: { color: 'var(--dim)' } },
              'The AI watches each ad break clip at 1 frame per second and identifies the last frame of every expected advert.'
            ),
            h('div', { className: 'rounded-xl p-4', style: { background: 'var(--pdim)', border: '1px solid var(--purple)' } },
              h('div', { className: 'space-y-2 mb-3' },
                [{ brand:'Tesco', time:'13:52:15' }, { brand:'Sky Mobile', time:'13:52:45' }, { brand:'Cadbury', time:'13:53:05' }]
                  .map((ad, i) =>
                    h('div', { key:i, className:'flex items-center gap-3 rounded-lg px-3 py-2', style:{background:'var(--bg)', border:'1px solid var(--border)'} },
                      h('div', { className:'w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold', style:{background:'var(--gdim)', color:'var(--green)', border:'1px solid var(--green)'} }, '\u2713'),
                      h('div', { className: 'flex-1' },
                        h('p', { className:'text-xs font-bold', style:{color:'var(--text)'} }, ad.brand),
                        h('p', { className:'text-xs', style:{color:'var(--muted)'} }, 'Last frame at ', ad.time)
                      ),
                      h('span', { className:'text-xs font-bold', style:{color:'var(--green)'} }, '\u2713 Found')
                    )
                  )
              ),
              h('div', { className: 'flex items-center gap-2 rounded-lg p-3', style: { background: 'var(--bg)', border: '1px solid var(--border)' } },
                h(Users, { className: 'w-4 h-4 shrink-0', style: { color: 'var(--green)' } }),
                h('p', { className: 'text-xs', style: { color: 'var(--dim)' } },
                  h('strong', { style: { color: 'var(--green)' } }, 'Ensemble voting: '),
                  'The AI watches ', h('strong', { style: { color: 'var(--yellow)' } }, '5 times'), ' independently and picks the median result.'
                )
              )
            )
          ),

          /* ── STEP 4 ── */
          Arrow(),
          h(StepCard, { icon: Search, title: 'Millisecond Precision (25 FPS)', i:3, tag:'NEW', color: 'var(--blue)' },
            h('p', { className: 'text-sm mb-4', style: { color: 'var(--dim)' } },
              'The 1 FPS detection gets you within one second \u2014 but broadcast video runs at 25 frames per second. The refinement stage zooms in: for each advert, it extracts a 3-second clip centred on the expected end time, then analyses it at full 25 FPS.'
            ),
            h('div', { className: 'grid grid-cols-2 gap-3 mb-3' },
              h('div', { className: 'rounded-xl p-3', style: { background: 'var(--bdim)', border: '1px solid var(--blue)' } },
                h('p', { className: 'text-xs font-bold mb-1', style: { color: 'var(--blue)' } }, '\ud83c\udfaf How It Works'),
                h('ul', { className: 'text-xs space-y-1 ml-3 list-disc', style: { color: 'var(--dim)' } },
                  h('li', null, '3-second clip per advert'),
                  h('li', null, 'Analysed at 25 FPS (75 frames)'),
                  h('li', null, '3 ensemble calls for accuracy'))
              ),
              h('div', { className: 'rounded-xl p-3', style: { background: 'var(--bdim)', border: '1px solid var(--blue)' } },
                h('p', { className: 'text-xs font-bold mb-1', style: { color: 'var(--blue)' } }, '\u26a1 Configurable FPS'),
                h('ul', { className: 'text-xs space-y-1 ml-3 list-disc', style: { color: 'var(--dim)' } },
                  h('li', null, '25 FPS default (PAL)'),
                  h('li', null, '24 FPS for NTSC sources'),
                  h('li', null, 'HH:MM:SS.mmm output'))
              )
            ),
            h('div', { className: 'rounded-xl p-3 space-y-1', style: { background: 'var(--bg)', border: '1px solid var(--border)' } },
              h('p', { className: 'text-xs', style: { color: 'var(--muted)' } },
                'Coarse (1 FPS):  ', h('span', { className: 'font-bold', style: { color: 'var(--yellow)' } }, '13:52:15')
              ),
              h('p', { className: 'text-xs', style: { color: 'var(--muted)' } },
                'Refined (25 FPS): ', h('span', { className: 'font-bold', style: { color: 'var(--green)' } }, '13:52:15.080')
              ),
              h('p', { className: 'text-xs mt-1', style: { color: 'var(--muted)' } }, '\u2191 Frame-accurate to \u00b140ms')
            )
          ),

          /* ── STEP 5 ── */
          Arrow(),
          h(StepCard, { icon: Film, title: 'Extract Individual Adverts', i:4, tag:'NEW', color: 'var(--green)' },
            h('p', { className: 'text-sm mb-4', style: { color: 'var(--dim)' } },
              'Using the refined frame-accurate timecodes, the tool extracts each advert as its own lossless H.264 video clip.'
            ),
            h('div', { className: 'rounded-xl p-4', style: { background: 'var(--gdim)', border: '1px solid var(--green)' } },
              h('p', { className: 'text-xs font-bold mb-2', style: { color: 'var(--green)' } }, 'Sample Output'),
              h('div', { className: 'rounded-lg p-3 space-y-1', style: { background: 'var(--bg)', border: '1px solid var(--border)' } },
                h('p', { className: 'text-xs', style: { color: 'var(--dim)' } }, 'clips/', h('span', { className:'font-bold', style:{color:'var(--green)'} }, 'BBHTCPT536010'), '_retail_Tesco.mp4'),
                h('p', { className: 'text-xs', style: { color: 'var(--dim)' } }, 'clips/', h('span', { className:'font-bold', style:{color:'var(--green)'} }, 'SKYMO2394030'), '_telecoms_Sky Mobile.mp4'),
                h('p', { className: 'text-xs', style: { color: 'var(--dim)' } }, 'clips/', h('span', { className:'font-bold', style:{color:'var(--green)'} }, 'CADBURY2030'), '_food_Cadbury.mp4')
              ),
              h('div', { className: 'flex items-center gap-2 mt-2 text-xs', style: { color: 'var(--green)' } },
                h(Zap, { className: 'w-3 h-3' }), h('span', null, 'Lossless extraction \u2014 no re-encoding')
              )
            )
          ),

          /* ── pipeline state ── */
          Arrow(),
          h(StepCard, { icon: GitMerge, title: 'Tracking Every Advert Through the Pipeline', i:5, tag:'LATEST', color: 'var(--pink)' },
            h('p', { className: 'text-sm mb-4', style: { color: 'var(--dim)' } },
              'A single "pipeline state file" follows each advert through every stage \u2014 from "metadata extracted" through "identified" to "refined".'
            ),
            h('div', { className: 'rounded-xl p-4', style: { background: 'var(--pkdim)', border: '1px solid var(--pink)' } },
              h('div', { className: 'flex flex-wrap items-center justify-center gap-2 text-xs' },
                ['Extracted','Clipped','Identified','Refined','Clipped'].map((s, i, a) =>
                  h('div', { key:s, className:'flex items-center gap-2' },
                    h('span', { className:'px-2.5 py-1 rounded-full font-bold whitespace-nowrap',
                      style: { background: 'var(--pkdim)', color: 'var(--pink)', border: '1px solid var(--pink)' }
                    }, '\u2713 ', s),
                    i < a.length-1 && h('span', { className:'text-xs', style:{color:'var(--muted)'} }, '\u2192')
                  )
                )
              ),
              h('p', { className: 'text-xs mt-2 text-center', style: { color: 'var(--pink)' } },
                'The state file bridges clip-relative timecodes to broadcast-absolute offsets.'
              )
            )
          ),

          /* ── full automation ── */
          h('div', { className: `rounded-xl p-5 mt-6 transition-all duration-700 delay-500 ease-out ${mounted?'opacity-100 translate-y-0':'opacity-0 translate-y-8'}`,
                      style: { background: 'var(--bdim)', border: '1px solid var(--blue)', borderLeft: '3px solid var(--blue)' } },
            h('div', { className: 'flex items-center gap-2 mb-2' },
              h(FolderOpen, { className: 'w-5 h-5', style: { color: 'var(--blue)' } }),
              h('p', { className: 'font-bold text-sm', style: { color: 'var(--blue)' } }, 'Full Automation Available')
            ),
            h('p', { className: 'text-sm mb-3', style: { color: 'var(--dim)' } },
              'Point the tool at an entire folder of recordings and it will process them all automatically \u2014 one command does everything.'
            ),
            h('div', { className: 'rounded-xl p-3 text-xs', style: { background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--blue)' } },
              'advert-identifier-pipeline \\', h('br'),
              '  --input-folder /path/to/videos \\', h('br'),
              '  --csv-folder /path/to/csv/files'
            )
          ),

          /* ── footer ── */
          h('div', { className: `text-center mt-8 mb-4 transition-all duration-700 delay-700 ease-out ${mounted?'opacity-100':'opacity-0'}` },
            h('p', { className: 'text-xs', style: { color: 'var(--muted)' } },
              'Powered by Qwen3.5 Vision-Language Model \u00b7 FFmpeg \u00b7 vLLM \u00b7 BFI National Archive'
            ),
            h('p', { className: 'text-xs mt-1', style: { opacity: 0.5, color: 'var(--muted)' } },
